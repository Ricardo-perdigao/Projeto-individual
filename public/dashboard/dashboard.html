<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triskelion | Dashboards</title>

    <link rel="stylesheet" href="./../css/estilo.css" />
    <script src="../js/sessao.js"></script>
    <script src="./../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="header">
        <div class="container">
            <div class="logo-area">
                <img src="../assets/imgs/triskelion_transparente.png" alt="logo">
            </div>
            <ul class="navbar">
                <li><a href="../index.html">Sair</a></li>
            </ul>
        </div>
    </div>

    <div class="pai">
        <div class="consulta-admin">
            <h2><i class="fa-solid fa-magnifying-glass"></i> Consulta do Visitante</h2>
            
            <div class="inputs-wrapper" style="display: flex; justify-content: center; gap: 10px; width: 100%;">
                <input type="number" id="idVisitanteInput" placeholder="ID do Visitante (Ex: 1)">
                <button onclick="carregarDashboard()">BUSCAR DADOS</button>
            </div>
            
            <p id="feedbackUsuario" style="margin-top: 10px; color: var(--nevoa); font-size: 0.9rem; display: none;"></p>
        </div>

        <div class="container dashboard-content">
            <div class="kpis">
                <div class="kpicard1">
                    <h4><i class="fa-solid fa-bullseye"></i> Acertos no Quiz</h4>
                    <div class="kpi-valor">
                        <span id="kpiAcertos">0</span> <span class="divisor">/</span> <span id="kpiTotalPerguntas">0</span>
                    </div>
                </div>

                <div class="kpicard2">
                    <h4><i class="fa-solid fa-xmark"></i> Total de Erros</h4>
                    <div class="kpi-valor">
                        <span id="kpiTotalErros">0</span>
                    </div>
                </div>

                <div class="kpicard3">
                    <h4><i class="fa-solid fa-percent"></i> Taxa de Sucesso</h4>
                    <div class="kpi-valor">
                        <span id="kpiPorcentagemAcerto">0.00%</span>
                    </div>
                </div>

                <div class="kpicard4">
                    <h4><i class="fa-solid fa-lock-open"></i> Pág. Desbloqueadas</h4>
                    <div class="kpi-valor">
                        <span id="kpiPaginasDesbloqueadas">0</span> <span class="divisor">/</span> <span>5</span>
                    </div>
                </div>
            </div>

            <div class="charts-group">
                <div class="chart-box">
                    <h3>Desempenho no Quiz</h3>
                    <div class="canvas-container" style="height: 200px; display: flex; align-items: center; justify-content: center;">
                        <canvas id="quizChart"></canvas>
                    </div>
                </div>

                <div class="chart-box">
                    <h3>Páginas desbloqueadas</h3>
                    <div class="canvas-container">
                        <canvas id="progressChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

<script>
    let quizChartInstance = null;
    let progressChartInstance = null;

    window.onload = buscarUltimoVisitante;

    function buscarUltimoVisitante() {
        document.getElementById('feedbackUsuario').innerText = "Carregando último visitante...";
        
        fetch(`/dashboard/ultimo`)
            .then(response => {
                if (response.ok) return response.json();
                if (response.status === 404) throw new Error("Nenhum visitante encontrado.");
                throw new Error(`Erro: ${response.status}`);
            })
            .then(data => {
                if (data.idVisitante) {
                    document.getElementById('idVisitanteInput').value = data.idVisitante;
                    document.getElementById('feedbackUsuario').innerText = `Exibindo dados do VisitorID: ${data.visitorID}`;
                }
                processarDadosDashboard(data);
            })
            .catch(error => {
                console.error(error);
                document.getElementById('feedbackUsuario').innerText = error.message;
                limparDashboard();
            });
    }

    function carregarDashboard() {
        const idVisitanteAlvo = document.getElementById('idVisitanteInput').value;
        if (!idVisitanteAlvo || idVisitanteAlvo <= 0) {
            alert("Insira um ID válido.");
            return;
        }
        buscarDadosDashboard(idVisitanteAlvo);
    }

    function buscarDadosDashboard(idVisitante) {
        document.getElementById('feedbackUsuario').innerText = "Buscando...";
        
        fetch(`/dashboard/dados/${idVisitante}`)
            .then(response => {
                if (response.ok) return response.json();
                if (response.status === 404) throw new Error("Visitante não encontrado.");
                throw new Error(`Erro: ${response.status}`);
            })
            .then(data => {
                document.getElementById('feedbackUsuario').innerText = `Exibindo dados do VisitorID: ${data.visitorID}`;
                processarDadosDashboard(data);
            })
            .catch(error => {
                console.error(error);
                document.getElementById('feedbackUsuario').innerText = error.message;
                limparDashboard();
            });
    }

    function processarDadosDashboard(data) {
        document.getElementById('kpiAcertos').innerText = data.acertos;
        document.getElementById('kpiTotalPerguntas').innerText = data.totalPerguntas;
        document.getElementById('kpiTotalErros').innerText = data.totalErros;
        document.getElementById('kpiPorcentagemAcerto').innerText = `${data.porcentagemAcerto}%`;
        
        document.getElementById('kpiPaginasDesbloqueadas').innerText = data.totalPaginasDesbloqueadas;

        renderizarGraficoQuiz(data.acertos, data.totalErros);
        renderizarGraficoProgresso(data.paginas, data.acessos);
    }

    function limparDashboard() {
        document.getElementById('kpiAcertos').innerText = 0;
        document.getElementById('kpiTotalPerguntas').innerText = 0;
        document.getElementById('kpiTotalErros').innerText = 0;
        document.getElementById('kpiPorcentagemAcerto').innerText = `0.00%`;
        document.getElementById('kpiPaginasDesbloqueadas').innerText = 0;

        if (quizChartInstance) quizChartInstance.destroy();
        if (progressChartInstance) progressChartInstance.destroy();
    }

    function renderizarGraficoQuiz(acertos, totalErros) {
        if (quizChartInstance) quizChartInstance.destroy();

        const ctx = document.getElementById('quizChart').getContext('2d');

        quizChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Acertos', 'Erros'],
                datasets: [{
                    data: [acertos, totalErros],
                    backgroundColor: ['#4B6B3A', '#8c2020'], 
                    borderColor: ['#8CBF66', '#ff6384'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { labels: { color: '#E9E7E1' } }
                }
            }
        });
    }

    function renderizarGraficoProgresso(labels, data) {
        if (progressChartInstance) progressChartInstance.destroy();

        const ctx = document.getElementById('progressChart').getContext('2d');

        progressChartInstance = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Total de Acessos',
                    data: data,
                    backgroundColor: '#C9A34A', 
                    borderColor: '#E9E7E1',
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false, 
                scales: {
                    y: { ticks: { color: '#E9E7E1' }, grid: { color: '#333' } },
                    x: { ticks: { color: '#E9E7E1' }, grid: { display: false } }
                },
                plugins: {
                    legend: { display: false } 
                }
            }
        });
    }
</script>
</html>
