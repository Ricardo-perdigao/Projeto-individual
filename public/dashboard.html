<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <title>Dashboard Unificada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/css/estilo.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <h1>Dashboard Unificada</h1>

    <div id="alerta-login" style="display:none; color:darkred; margin-bottom:12px;">
      Faça login para ver seu dashboard.
    </div>

    <section style="display:flex; gap:24px; flex-wrap:wrap;">
      <div style="flex:1; min-width:320px;">
        <h3>Quiz — Acertos vs Erros</h3>
        <canvas id="quizChart" width="400" height="300"></canvas>
      </div>

      <div style="flex:1; min-width:320px;">
        <h3>Progresso — Acessos por página</h3>
        <canvas id="progressChart" width="400" height="300"></canvas>
      </div>
    </section>

    <section style="margin-top:24px;">
      <h3>Detalhes</h3>
      <pre id="rawData" style="background:#f7f7f7; padding:12px; border-radius:6px; max-height:300px; overflow:auto;"></pre>
    </section>
  </div>

  <script src="/dashboard/dashboard.js"></script>
</body>
</html>
