    <!DOCTYPE html>
    <html lang="pt-br">

    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <title>Triskelion | Login</title>

        <script src="./js/sessao.js"></script>

        <link rel="stylesheet" href="./css/estilo.css">
        <link rel="icon" href="./assets/icon/favicon2.ico">
        <link rel="preconnect" href="https://fonts.gstatic.com">
    </head>

    <body data-pagina="login">
    <body>

        <!--Header-->

        <div class="header">
            <div class="container">
                <div class="logo-area">
                    <img src="./assets/imgs/triskelion_transparente.png" alt="logo">
                </div>
                <ul class="navbar">
                    <li>
                        <a href="index.html">Inicial</a>
                    </li>
                    <li>|</li>
                    <li class="agora">
                        <a href="#">Login</a>
                    </li>
                    <li>
                        <a href="cadastro.html" style="display: none;">Cadastro</a>
                    </li>
                </ul>
            </div>
        </div>
        <div class="banner1">
            <div class="video-bg">
                <img src="./assets/video/login.gif" alt="login">
            </div>
            <div class="login">
                <div class="alerta_erro">
                    <div class="card_erro" id="cardErro">
                        <span id="mensagem_erro"></span>
                    </div>
                </div>
                <div class="container">
                    <div class="card">
                        <h2>Olá de volta!</h2>
                        <div class="formulario">
                            <div class="campo">
                                <span>E-mail:</span>
                                <input id="email_input" type="text" placeholder="Login">
                            </div>
                            <div class="campo">
                                <span>Senha:</span>
                                <input id="senha_input" type="password" placeholder="******">
                            </div>
                            <button class="botao" onclick="entrar()">Entrar</button>
                        </div>

                        <div id="div_erros_login"></div>
                    </div>
                </div>
            </div>
        </div>

        <!--footer inicio-->
        <div class="footer">
            <div class="container">
                <h4>Feito com amor por aluno &hearts; SPTech &copy; 2023</h4>
                <span class="version">v1.0.0</span>
            </div>
        </div>
        <!--footer fim-->

    </body>

    </html>
    <script src="./js/navbar.js"></script>
    <script>
        window.onload = function () {

            const visitorID = localStorage.getItem("VISITOR_ID");

            if (!visitorID) return;

            fetch("/usuarios/autoCadastro", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ visitorID })
            })
                .then(r => {
                    if (!r.ok) throw new Error("Erro HTTP " + r.status);
                    return r.json();
                })
                .then(j => console.log("Cadastro automático OK:", j))
                .catch(e => console.error("Erro no cadastro automático:", e));
        };



        function entrar() {

            var emailVar = email_input.value;
            var senhaVar = senha_input.value;
            var visitorID = localStorage.getItem("VISITOR_ID");

            if (emailVar == "" || senhaVar == "") {
                cardErro.style.display = "block"
                mensagem_erro.innerHTML = "Preencha todos os campos!";
                return false;
            }

            console.log("FORM LOGIN:", emailVar);
            console.log("FORM SENHA:", senhaVar);
            console.log("FORM VISITOR:", visitorID);

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: emailVar,
                    senhaServer: senhaVar
                })
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        return resposta.json();
                    } else {
                        throw "Erro ao realizar login";
                    }
                })
                .then(json => {
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.ID_USUARIO = json.idUsuario;
                    sessionStorage.VISITOR_ID = json.visitorID;

                    window.location = "./dashboard/cards.html";
                })
                .catch(err => {
                    console.error(err);
                    mensagem_erro.innerHTML = "Login inválido!";
                    cardErro.style.display = "block";
                });

            return false;
        }

        function sumirMensagem() {
            cardErro.style.display = "none"
        }

    </script>
